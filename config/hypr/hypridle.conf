# Ociosidade: escurece a tela, bloqueia, desliga o monitor e suspende.
# Para desativar temporariamente: menu → Alternar → "Manter a tela acesa"

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
}

# Sem etapa de brilho: esta máquina é desktop, não tem backlight controlável.

# 8 min — bloqueia
listener {
    timeout = 480
    on-timeout = loginctl lock-session
}

# 10 min — desliga a tela
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min — suspende
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
